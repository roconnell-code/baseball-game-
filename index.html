<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catcher's View — Swing</title>
  <style>
    :root {
      --dirt: #c4a06a;
      --grass: #2f7a3a;
      --ink: #f4efe4;
      --gold: #f4d35e;
      --red: #d62828;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1220;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: min(1100px, 100%);
      padding: 14px 18px 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .sub { margin: 4px 0 0; color: #9db0c9; font-size: 0.92rem; }
    .hud {
      display: flex;
      gap: 18px;
      font-size: 0.95rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .hud b { color: var(--gold); }
    .strikes { letter-spacing: 0.2em; color: var(--red); }
    .wrap {
      width: min(1100px, 100%);
      padding: 0 18px 18px;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      border: 3px solid #243044;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
      background: #87ceeb;
      cursor: crosshair;
    }
    kbd {
      display: inline-block;
      padding: 1px 7px;
      border: 2px solid #9db0c9;
      border-bottom-width: 3px;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Home Plate</h1>
      <p class="sub">Catcher's view. Press <kbd>Space</kbd> to swing. Time the pitch.</p>
    </div>
    <div class="hud">
      <span>Strikes <b class="strikes" id="strikes">● ● ●</b></span>
      <span>Last <b id="last">—</b></span>
      <span>Best <b id="best">0 ft</b></span>
      <span>Hits <b id="hits">0</b></span>
    </div>
  </header>
  <div class="wrap">
    <canvas id="game" width="1100" height="620"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    const strikesEl = document.getElementById("strikes");
    const lastEl = document.getElementById("last");
    const bestEl = document.getElementById("best");
    const hitsEl = document.getElementById("hits");

    const audio = new (window.AudioContext || window.webkitAudioContext)();

    function beep(freq, dur, type, gain) {
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = type || "triangle";
      o.frequency.value = freq;
      g.gain.value = gain || 0.08;
      o.connect(g);
      g.connect(audio.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
      o.stop(audio.currentTime + dur);
    }

    const state = {
      mode: "title",
      strikes: 0,
      hits: 0,
      best: 0,
      last: "—",
      phase: "idle",
      t: 0,
      pitchT: 0,
      pitchDur: 1.05,
      swingT: -1,
      batAngle: -0.35,
      swingCooldown: 0,
      result: null,
      resultT: 0,
      ball: { z: 60.5, y: 4.2, x: 0, vx: 0, vy: 0, vz: 0, hit: false, gone: false },
      pitcherArm: 0,
      crowd: 0,
      flash: 0,
    };

    function resetGame() {
      state.mode = "play";
      state.strikes = 0;
      state.hits = 0;
      state.best = 0;
      state.last = "—";
      state.result = null;
      startIdle();
      updateHud();
    }

    function startIdle() {
      state.phase = "idle";
      state.t = 0;
      state.swingT = -1;
      state.batAngle = -0.35;
      state.ball = { z: 60.5, y: 4.2, x: 0.2, vx: 0, vy: 0, vz: 0, hit: false, gone: false };
      state.pitcherArm = 0;
    }

    function startWindup() {
      state.phase = "windup";
      state.t = 0;
      state.swingT = -1;
      state.pitchDur = 0.95 + Math.random() * 0.28;
      state.ball.x = (Math.random() - 0.5) * 1.4;
      state.ball.y = 3.8 + Math.random() * 0.8;
    }

    function startPitch() {
      state.phase = "pitch";
      state.pitchT = 0;
      state.swingT = -1;
      beep(180, 0.08, "sine", 0.04);
    }

    function updateHud() {
      const dots = [0, 1, 2].map((i) => (i < state.strikes ? "●" : "○")).join(" ");
      strikesEl.textContent = dots;
      lastEl.textContent = state.last;
      bestEl.textContent = Math.round(state.best) + " ft";
      hitsEl.textContent = String(state.hits);
    }

    function project(x, y, z) {
      const camZ = -2.2;
      const depth = Math.max(0.35, z - camZ);
      const scale = 520 / depth;
      return {
        x: W * 0.52 + x * scale,
        y: H * 0.62 - y * scale + depth * 1.15,
        s: scale,
      };
    }

    function perfectWindow() {
      return 0.9;
    }

    function swing() {
      if (state.mode !== "play") {
        if (state.mode === "title" || state.mode === "over") {
          if (audio.state === "suspended") audio.resume();
          resetGame();
        }
        return;
      }
      if (state.phase === "result" || state.phase === "idle" || state.swingT >= 0 || state.swingCooldown > 0) return;
      state.swingT = state.phase === "pitch" ? state.pitchT : -1;
      state.swingCooldown = 0.55;
      beep(140, 0.12, "sawtooth", 0.05);

      if (state.phase !== "pitch") {
        resolveMiss("Too early");
        return;
      }
      judgeSwing();
    }

    function judgeSwing() {
      const p = state.pitchT / state.pitchDur;
      const perfect = perfectWindow();
      const err = p - perfect;
      const abs = Math.abs(err);

      if (p < 0.72 || p > 0.99) {
        resolveMiss(p < 0.72 ? "Way early" : "Too late");
        return;
      }

      const quality = Math.max(0, 1 - abs / 0.16);
      const boosted = Math.pow(quality, 1.15);
      const feet = 40 + boosted * 430;
      const labels = [
        [0.93, "CRUSHED — HOME RUN"],
        [0.8, "GONE — HOME RUN"],
        [0.62, "Deep fly"],
        [0.45, "Line drive"],
        [0.28, "Bloop single"],
        [0, "Weak contact"],
      ];
      const label = labels.find((row) => boosted >= row[0])[1];
      resolveHit(feet, boosted, label, err);
    }

    function resolveHit(feet, quality, label, err) {
      state.phase = "result";
      state.resultT = 0;
      state.ball.hit = true;
      state.ball.gone = quality > 0.78;
      state.ball.vz = -(18 + quality * 28);
      state.ball.vy = 6 + quality * 16;
      state.ball.vx = (err < 0 ? -1 : 1) * (0.8 + Math.abs(err) * 8);
      state.hits += 1;
      state.best = Math.max(state.best, feet);
      state.last = Math.round(feet) + " ft";
      state.result = { kind: "hit", feet, label, quality };
      state.flash = quality > 0.78 ? 0.45 : 0.18;
      state.crowd = quality;
      beep(520, 0.08, "square", 0.06);
      setTimeout(() => beep(780, 0.18, "triangle", 0.07), 40);
      if (quality > 0.78) {
        setTimeout(() => beep(220, 0.4, "sine", 0.05), 80);
      }
      updateHud();
    }

    function resolveMiss(why) {
      state.phase = "result";
      state.resultT = 0;
      state.strikes += 1;
      state.last = "Miss";
      state.result = { kind: "miss", label: why || "Swing and a miss" };
      state.flash = 0.2;
      beep(90, 0.25, "square", 0.06);
      updateHud();
      if (state.strikes >= 3) {
        state.mode = "over";
      }
    }

    function takePitch() {
      state.phase = "result";
      state.resultT = 0;
      state.last = "Take";
      state.result = { kind: "take", label: "Taken. No swing." };
      updateHud();
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        swing();
      }
    });
    canvas.addEventListener("pointerdown", () => swing());

    function drawSky() {
      const g = ctx.createLinearGradient(0, 0, 0, H * 0.55);
      g.addColorStop(0, "#6cb6e8");
      g.addColorStop(0.55, "#b7dff7");
      g.addColorStop(1, "#e8f4c8");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "rgba(255,255,255,0.85)";
      for (const c of [[140, 70, 90], [380, 50, 110], [820, 80, 120]]) {
        ctx.beginPath();
        ctx.ellipse(c[0], c[1], c[2], 22, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawStadium() {
      ctx.fillStyle = "#3a4658";
      ctx.beginPath();
      ctx.moveTo(0, 250);
      ctx.quadraticCurveTo(W / 2, 70, W, 250);
      ctx.lineTo(W, 340);
      ctx.quadraticCurveTo(W / 2, 180, 0, 340);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#2a3344";
      for (let i = 0; i < 18; i++) {
        const x = 40 + i * 60;
        ctx.fillRect(x, 170 + Math.sin(i) * 8, 28, 90);
      }

      const wall = ctx.createLinearGradient(0, 300, 0, 390);
      wall.addColorStop(0, "#1f6b3a");
      wall.addColorStop(1, "#2f8a48");
      ctx.fillStyle = wall;
      ctx.beginPath();
      ctx.moveTo(80, 350);
      ctx.quadraticCurveTo(W / 2, 250, W - 40, 360);
      ctx.lineTo(W, 410);
      ctx.lineTo(0, 400);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#c9d6e2";
      ctx.font = "bold 18px Trebuchet MS";
      ctx.textAlign = "center";
      ctx.fillText("HOME RUN  380", W * 0.5, 318);
    }

    function drawField() {
      const grass = ctx.createLinearGradient(0, 360, 0, H);
      grass.addColorStop(0, "#3c9a4a");
      grass.addColorStop(1, "#1e5c28");
      ctx.fillStyle = grass;
      ctx.fillRect(0, 360, W, H - 360);

      ctx.fillStyle = "#d2b48c";
      ctx.beginPath();
      ctx.moveTo(W * 0.52, 390);
      ctx.lineTo(W + 80, H);
      ctx.lineTo(-80, H);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#c19a6b";
      const mound = project(0, 0.2, 60.5);
      ctx.beginPath();
      ctx.ellipse(mound.x, mound.y + 18, 46, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      const plate = project(0, 0, 1.6);
      ctx.fillStyle = "#f7f3ea";
      ctx.beginPath();
      ctx.moveTo(plate.x, plate.y - 18);
      ctx.lineTo(plate.x + 42, plate.y + 6);
      ctx.lineTo(plate.x + 26, plate.y + 28);
      ctx.lineTo(plate.x - 26, plate.y + 28);
      ctx.lineTo(plate.x - 42, plate.y + 6);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#8a8174";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawPitcher(t) {
      const p = project(0, 5.4, 60.5);
      const s = p.s * 0.085;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(s, s);

      let arm = -0.4;
      if (state.phase === "windup") arm = -2.4 + Math.sin(state.t * 7) * 0.2;
      if (state.phase === "pitch") arm = -0.2 + state.pitchT * 2.2;
      if (state.phase === "result" && !state.ball.hit) arm = 1.4;

      ctx.fillStyle = "#fff";
      ctx.fillRect(-10, 8, 20, 28);
      ctx.fillStyle = "#1d3557";
      ctx.fillRect(-11, 34, 10, 22);
      ctx.fillRect(1, 34, 10, 22);
      ctx.fillStyle = "#e63946";
      ctx.fillRect(-10, 8, 20, 8);

      ctx.save();
      ctx.translate(8, 14);
      ctx.rotate(arm);
      ctx.fillStyle = "#fff";
      ctx.fillRect(-4, -4, 8, 26);
      ctx.fillStyle = "#f1c27d";
      ctx.beginPath();
      ctx.arc(0, 24, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = "#f1c27d";
      ctx.beginPath();
      ctx.arc(0, 2, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#111";
      ctx.fillRect(-9, -6, 18, 6);
      ctx.restore();
    }

    function drawBatter() {
      const p = project(-7.2, 4.8, 6.8);
      const s = p.s * 0.12;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(s, s);

      ctx.fillStyle = "#1d3557";
      ctx.fillRect(-12, 10, 24, 36);
      ctx.fillRect(-16, 44, 12, 28);
      ctx.fillRect(2, 44, 12, 28);
      ctx.fillStyle = "#e63946";
      ctx.fillRect(-12, 10, 24, 7);
      ctx.fillStyle = "#f1c27d";
      ctx.beginPath();
      ctx.arc(-2, 2, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.arc(-2, 0, 10, Math.PI, 0);
      ctx.fill();

      ctx.save();
      ctx.translate(10, 16);
      const swinging = state.swingCooldown > 0.12;
      const target = swinging ? 2.5 : -0.55;
      state.batAngle += (target - state.batAngle) * 0.35;
      ctx.rotate(state.batAngle);
      ctx.fillStyle = "#f1c27d";
      ctx.fillRect(-3, -3, 8, 14);
      ctx.fillStyle = "#8b5a2b";
      ctx.fillRect(0, -52, 5, 54);
      ctx.fillStyle = "#d9b382";
      ctx.fillRect(-1, -58, 7, 10);
      ctx.restore();
      ctx.restore();
    }

    function drawBall() {
      const b = state.ball;
      if (state.phase === "idle" || state.phase === "windup") return;
      if (b.z < -4 && !b.hit) return;
      const p = project(b.x, b.y, Math.max(0.4, b.z));
      const r = Math.max(3, Math.min(28, p.s * 0.09));
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      const ground = project(b.x, 0, Math.max(0.4, b.z));
      ctx.beginPath();
      ctx.ellipse(ground.x, ground.y + 8, r * 1.2, r * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#d62828";
      ctx.lineWidth = Math.max(1, r * 0.12);
      ctx.beginPath();
      ctx.arc(p.x - r * 0.15, p.y, r * 0.7, -0.8, 0.8);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(p.x + r * 0.15, p.y, r * 0.7, Math.PI - 0.8, Math.PI + 0.8);
      ctx.stroke();
      ctx.restore();
    }

    function drawCatcherOverlay() {
      ctx.fillStyle = "#1b2433";
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, H - 90);
      ctx.quadraticCurveTo(W * 0.25, H - 40, W * 0.5, H - 28);
      ctx.quadraticCurveTo(W * 0.75, H - 40, W, H - 90);
      ctx.lineTo(W, H);
      ctx.fill();

      const gx = W * 0.62;
      const gy = H - 70;
      ctx.save();
      ctx.translate(gx, gy);
      ctx.rotate(-0.25);
      ctx.fillStyle = "#7a3e1d";
      ctx.beginPath();
      ctx.ellipse(0, 0, 54, 38, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#5c2e14";
      ctx.beginPath();
      ctx.ellipse(6, 4, 22, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = "rgba(10,12,16,0.55)";
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(W * 0.18, 0);
      ctx.lineTo(W * 0.22, H * 0.22);
      ctx.moveTo(W * 0.82, 0);
      ctx.lineTo(W * 0.78, H * 0.22);
      ctx.stroke();
    }

    function drawHudOverlay() {
      if (state.flash > 0) {
        ctx.fillStyle = state.result && state.result.kind === "hit"
          ? `rgba(255,230,120,${state.flash * 0.45})`
          : `rgba(180,20,20,${state.flash * 0.35})`;
        ctx.fillRect(0, 0, W, H);
      }

      ctx.textAlign = "center";
      if (state.mode === "title") {
        banner("CATCHER'S VIEW", "Press Space to start", "Swing when the ball reaches the plate");
      } else if (state.mode === "over") {
        banner("THREE STRIKES — YOU'RE OUT", "Press Space to play again", `Best drive ${Math.round(state.best)} ft  •  ${state.hits} hits`);
      } else if (state.phase === "idle") {
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.font = "bold 22px Trebuchet MS";
        ctx.fillText("Pitcher coming set…", W / 2, 52);
      } else if (state.phase === "windup") {
        ctx.fillStyle = "#111";
        ctx.font = "bold 26px Trebuchet MS";
        ctx.fillText("HERE IT COMES", W / 2, 52);
      } else if (state.phase === "result" && state.result) {
        const r = state.result;
        ctx.fillStyle = r.kind === "hit" ? "#14213d" : "#111";
        ctx.font = "bold 34px Trebuchet MS";
        ctx.fillText(r.label, W / 2, 58);
        if (r.kind === "hit") {
          ctx.font = "bold 22px Trebuchet MS";
          ctx.fillStyle = "#f4d35e";
          ctx.fillText(Math.round(r.feet) + " feet", W / 2, 90);
        }
      }
    }

    function banner(title, line, extra) {
      ctx.fillStyle = "rgba(8,12,20,0.62)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#f4d35e";
      ctx.font = "bold 48px Trebuchet MS";
      ctx.fillText(title, W / 2, H * 0.42);
      ctx.fillStyle = "#fff";
      ctx.font = "22px Trebuchet MS";
      ctx.fillText(line, W / 2, H * 0.5);
      ctx.fillStyle = "#c5d4e6";
      ctx.font = "18px Trebuchet MS";
      ctx.fillText(extra, W / 2, H * 0.56);
    }

    let last = performance.now();
    function tick(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      render();
      requestAnimationFrame(tick);
    }

    function update(dt) {
      state.flash = Math.max(0, state.flash - dt);
      state.swingCooldown = Math.max(0, state.swingCooldown - dt);
      if (state.mode !== "play") return;

      if (state.phase === "idle") {
        state.t += dt;
        if (state.t > 1.15) startWindup();
      } else if (state.phase === "windup") {
        state.t += dt;
        state.pitcherArm = state.t;
        if (state.t > 0.85) startPitch();
      } else if (state.phase === "pitch") {
        state.pitchT += dt;
        const u = Math.min(1, state.pitchT / state.pitchDur);
        state.ball.z = 60.5 + (-2.2 - 60.5) * u;
        state.ball.y = 4.2 - u * 2.35 + Math.sin(u * Math.PI) * 0.2;
        state.ball.x += (0 - state.ball.x) * dt * 0.8;
        if (state.pitchT >= state.pitchDur + 0.12 && state.swingT < 0) {
          takePitch();
        }
      } else if (state.phase === "result") {
        state.resultT += dt;
        if (state.ball.hit) {
          state.ball.z += state.ball.vz * dt;
          state.ball.y += state.ball.vy * dt;
          state.ball.x += state.ball.vx * dt;
          state.ball.vy -= 22 * dt;
          state.ball.vz *= 0.995;
        } else {
          state.ball.z = Math.max(-3, state.ball.z - 18 * dt);
          state.ball.y = Math.max(0.4, state.ball.y - 4 * dt);
        }
        const wait = state.result && state.result.kind === "hit" ? 1.55 : 1.05;
        if (state.resultT > wait && state.mode === "play") startIdle();
      }
    }

    function render() {
      drawSky();
      drawStadium();
      drawField();
      drawPitcher();
      if (!state.ball.hit) drawBall();
      drawBatter();
      if (state.ball.hit) drawBall();
      drawCatcherOverlay();
      drawHudOverlay();
    }

    updateHud();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
